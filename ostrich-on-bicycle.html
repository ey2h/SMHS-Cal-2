<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鸵鸟骑自行车 · SVG 动画</title>
<style>
  :root {
    --ink: #1d2733;
    --muted: #6b7a8c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 32px 16px;
    background: radial-gradient(1200px 700px at 50% 20%, #243447, #131b25 70%);
    color: #e8eef5;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  h1 {
    margin: 0;
    font-size: clamp(20px, 3.2vw, 30px);
    font-weight: 600;
    letter-spacing: .06em;
  }
  p.sub {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }
  .stage {
    width: min(960px, 100%);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08);
    background: #bfe3f5;
  }
  svg { display: block; width: 100%; height: auto; }
  .controls { display: flex; gap: 10px; }
  button {
    font: inherit;
    font-size: 14px;
    padding: 8px 18px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.08);
    color: #e8eef5;
    cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }
  button:hover { background: rgba(255,255,255,.16); }
  button:active { transform: translateY(1px); }
  footer { color: #55677c; font-size: 12px; }
</style>
</head>
<body>

<h1>鸵鸟骑自行车</h1>
<p class="sub">纯 SVG + SMIL 动画 · 腿部按脚踏曲柄做逆运动学关键帧</p>

<div class="stage">
<svg id="scene" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="一只鸵鸟骑着一辆红色自行车在公路上前进">

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#8fd0f2"/>
      <stop offset="55%" stop-color="#c6e8f7"/>
      <stop offset="100%" stop-color="#eef6f2"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b636d"/>
      <stop offset="100%" stop-color="#3f454d"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff6c8" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#fff6c8" stop-opacity="0"/>
    </radialGradient>

    <!-- 远山瓦片（宽 450，两端等高以便无缝拼接） -->
    <g id="hillTile">
      <path d="M0,400 L0,340 Q70,296 140,340 Q200,376 260,332 Q330,286 390,340 Q420,364 450,340 L450,400 Z"
            fill="#9dc3e0"/>
      <path d="M0,400 L0,368 Q90,336 170,368 Q250,396 330,362 Q390,338 450,368 L450,400 Z"
            fill="#b7d6ea"/>
    </g>

    <!-- 云朵瓦片（宽 450） -->
    <g id="cloudTile">
      <g fill="#ffffff" opacity=".9">
        <ellipse cx="80" cy="92" rx="38" ry="19"/>
        <ellipse cx="112" cy="82" rx="29" ry="22"/>
        <ellipse cx="48" cy="98" rx="25" ry="14"/>
      </g>
      <g fill="#ffffff" opacity=".55">
        <ellipse cx="300" cy="150" rx="30" ry="13"/>
        <ellipse cx="328" cy="143" rx="21" ry="15"/>
      </g>
    </g>

    <!-- 路边灌木瓦片（宽 240） -->
    <g id="bushTile">
      <g fill="#5f8f57">
        <circle cx="40" cy="384" r="20"/>
        <circle cx="63" cy="391" r="14"/>
        <circle cx="21" cy="392" r="12"/>
      </g>
      <path d="M150,400 l4,-17 4,17 z" fill="#4f7a49"/>
      <path d="M162,400 l3,-12 3,12 z" fill="#4f7a49"/>
      <circle cx="206" cy="392" r="9" fill="#6ba35f"/>
    </g>
  </defs>

  <!-- ===== 天空 ===== -->
  <rect x="0" y="0" width="900" height="405" fill="url(#sky)"/>
  <circle cx="742" cy="86" r="90" fill="url(#sunGlow)"/>
  <circle cx="742" cy="86" r="30" fill="#ffd75e"/>

  <!-- 云（缓慢视差滚动） -->
  <g>
    <use href="#cloudTile" x="0"/>
    <use href="#cloudTile" x="450"/>
    <use href="#cloudTile" x="900"/>
    <animateTransform attributeName="transform" type="translate"
                      from="0 0" to="-450 0" dur="10.4s" repeatCount="indefinite"/>
  </g>

  <!-- 远山（中速视差滚动） -->
  <g>
    <use href="#hillTile" x="0"/>
    <use href="#hillTile" x="450"/>
    <use href="#hillTile" x="900"/>
    <use href="#hillTile" x="1350"/>
    <animateTransform attributeName="transform" type="translate"
                      from="0 0" to="-450 0" dur="4.46s" repeatCount="indefinite"/>
  </g>

  <!-- 草地 -->
  <rect x="0" y="392" width="900" height="16" fill="#7fae6b"/>

  <!-- 路边灌木（与车速同步） -->
  <g>
    <use href="#bushTile" x="0"/>
    <use href="#bushTile" x="240"/>
    <use href="#bushTile" x="480"/>
    <use href="#bushTile" x="720"/>
    <use href="#bushTile" x="960"/>
    <animateTransform attributeName="transform" type="translate"
                      from="0 0" to="-240 0" dur="0.833s" repeatCount="indefinite"/>
  </g>

  <!-- ===== 公路 ===== -->
  <rect x="0" y="405" width="900" height="68" fill="url(#road)"/>
  <line x1="0" y1="439" x2="900" y2="439" stroke="#f2d94e" stroke-width="5"
        stroke-dasharray="48 48">
    <animate attributeName="stroke-dashoffset" from="0" to="-96" dur="0.333s" repeatCount="indefinite"/>
  </line>
  <rect x="0" y="473" width="900" height="27" fill="#2f353c"/>

  <!-- 地面阴影 -->
  <ellipse cx="425" cy="410" rx="150" ry="11" fill="#000" opacity=".18"/>

  <!-- ===== 速度线 ===== -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".75">
    <line x1="205" y1="176" x2="255" y2="176">
      <animate attributeName="x1" values="255;175" dur="0.55s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="305;225" dur="0.55s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.9;0" dur="0.55s" repeatCount="indefinite"/>
    </line>
    <line x1="170" y1="232" x2="230" y2="232">
      <animate attributeName="x1" values="240;150" dur="0.55s" begin="0.18s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="300;210" dur="0.55s" begin="0.18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.85;0" dur="0.55s" begin="0.18s" repeatCount="indefinite"/>
    </line>
    <line x1="215" y1="288" x2="265" y2="288">
      <animate attributeName="x1" values="265;185" dur="0.55s" begin="0.36s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="315;235" dur="0.55s" begin="0.36s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.8;0" dur="0.55s" begin="0.36s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ===== 鸵鸟：远侧腿（相位差 180°） ===== -->
  <polyline fill="none" stroke="#c2703c" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"
            points="378,258 334.29,318.93 397,350 415,355">
    <animate attributeName="points" dur="1.2s" repeatCount="indefinite"
      values="378,258 334.29,318.93 397,350 415,355;
              378,258 335.93,320.09 405.2,330.2 423.2,335.2;
              378,258 355.42,329.5 425,322 443,327;
              378,258 374.86,332.93 444.8,330.2 462.8,335.2;
              378,258 385.25,332.61 453,350 471,355;
              378,258 385.49,332.63 444.8,369.8 462.8,374.8;
              378,258 371.58,332.73 425,378 443,383;
              378,258 349.51,327.38 405.2,369.8 423.2,374.8;
              378,258 334.29,318.93 397,350 415,355"/>
  </polyline>

  <!-- ===== 自行车 ===== -->
  <g>
    <!-- 后轮 -->
    <g>
      <circle cx="330" cy="350" r="55" fill="none" stroke="#23282e" stroke-width="9"/>
      <circle cx="330" cy="350" r="46" fill="none" stroke="#cfd6dd" stroke-width="3"/>
      <g stroke="#aeb7c0" stroke-width="2.5">
        <line x1="330" y1="304" x2="330" y2="396"/>
        <line x1="284" y1="350" x2="376" y2="350"/>
        <line x1="297" y1="317" x2="363" y2="383"/>
        <line x1="363" y1="317" x2="297" y2="383"/>
      </g>
      <circle cx="330" cy="350" r="11" fill="#cfd6dd" stroke="#8b949d" stroke-width="2"/>
      <circle cx="330" cy="350" r="15" fill="none" stroke="#9aa3ac" stroke-width="3" stroke-dasharray="3 4"/>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 330 350" to="360 330 350" dur="1.2s" repeatCount="indefinite"/>
    </g>

    <!-- 前轮 -->
    <g>
      <circle cx="520" cy="350" r="55" fill="none" stroke="#23282e" stroke-width="9"/>
      <circle cx="520" cy="350" r="46" fill="none" stroke="#cfd6dd" stroke-width="3"/>
      <g stroke="#aeb7c0" stroke-width="2.5">
        <line x1="520" y1="304" x2="520" y2="396"/>
        <line x1="474" y1="350" x2="566" y2="350"/>
        <line x1="487" y1="317" x2="553" y2="383"/>
        <line x1="553" y1="317" x2="487" y2="383"/>
      </g>
      <circle cx="520" cy="350" r="8" fill="#cfd6dd" stroke="#8b949d" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 520 350" to="360 520 350" dur="1.2s" repeatCount="indefinite"/>
    </g>

    <!-- 链条 -->
    <path d="M425,330 L330,339 A11,11 0 0 0 330,361 L425,370 A20,20 0 0 1 425,330 Z"
          fill="none" stroke="#7d858e" stroke-width="4"/>

    <!-- 车架 -->
    <g fill="none" stroke="#e04b3f" stroke-width="8" stroke-linecap="round">
      <path d="M330,350 L425,350"/>   <!-- 后下叉 -->
      <path d="M330,350 L398,268"/>   <!-- 后上叉 -->
      <path d="M425,350 L398,268"/>   <!-- 立管 -->
      <path d="M425,350 L512,296"/>   <!-- 下管 -->
      <path d="M398,268 L500,252"/>   <!-- 上管 -->
      <path d="M500,252 L512,296"/>   <!-- 头管 -->
      <path d="M512,296 L520,350"/>   <!-- 前叉 -->
    </g>

    <!-- 座管 + 车座 -->
    <path d="M398,268 L394,256" stroke="#e04b3f" stroke-width="7" stroke-linecap="round"/>
    <path d="M368,256 Q392,244 416,254 Q392,264 368,256 Z" fill="#2b3038"/>

    <!-- 把立 + 弯把 -->
    <g fill="none" stroke="#2b3038" stroke-width="6" stroke-linecap="round">
      <path d="M500,252 L486,244"/>
      <path d="M486,244 C472,238 474,262 492,266"/>
    </g>

    <!-- 牙盘 -->
    <circle cx="425" cy="350" r="20" fill="#dfe5ea" stroke="#8b949d" stroke-width="2"/>
    <g>
      <circle cx="425" cy="350" r="16" fill="none" stroke="#9aa3ac" stroke-width="4" stroke-dasharray="4 5"/>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 425 350" to="360 425 350" dur="1.2s" repeatCount="indefinite"/>
    </g>

    <!-- 曲柄（远侧臂） -->
    <g stroke="#4a525c" stroke-width="7" stroke-linecap="round">
      <line x1="425" y1="350" x2="397" y2="350"/>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 425 350" to="360 425 350" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <!-- 远侧脚踏（保持水平，沿圆周平移） -->
    <g>
      <rect x="-13" y="-4" width="26" height="8" rx="2" fill="#3a4048"/>
      <animateMotion dur="1.2s" repeatCount="indefinite"
                     path="M397,350 A28,28 0 1 1 453,350 A28,28 0 1 1 397,350"/>
    </g>

    <!-- 曲柄（近侧臂） -->
    <g stroke="#5c6570" stroke-width="8" stroke-linecap="round">
      <line x1="425" y1="350" x2="453" y2="350"/>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 425 350" to="360 425 350" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <!-- 近侧脚踏 -->
    <g>
      <rect x="-14" y="-4.5" width="28" height="9" rx="2" fill="#2b3038"/>
      <animateMotion dur="1.2s" repeatCount="indefinite"
                     path="M453,350 A28,28 0 1 1 397,350 A28,28 0 1 1 453,350"/>
    </g>
  </g>

  <!-- ===== 鸵鸟：近侧腿 ===== -->
  <polyline fill="none" stroke="#e08a4c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"
            points="378,258 385.25,332.61 453,350 471,355">
    <animate attributeName="points" dur="1.2s" repeatCount="indefinite"
      values="378,258 385.25,332.61 453,350 471,355;
              378,258 385.49,332.63 444.8,369.8 462.8,374.8;
              378,258 371.58,332.73 425,378 443,383;
              378,258 349.51,327.38 405.2,369.8 423.2,374.8;
              378,258 334.29,318.93 397,350 415,355;
              378,258 335.93,320.09 405.2,330.2 423.2,335.2;
              378,258 355.42,329.5 425,322 443,327;
              378,258 374.86,332.93 444.8,330.2 462.8,335.2;
              378,258 385.25,332.61 453,350 471,355"/>
  </polyline>

  <!-- ===== 鸵鸟上半身（随踩踏轻微起伏） ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -3.5; 0 0" dur="0.6s" repeatCount="indefinite"/>

    <!-- 尾羽 -->
    <g>
      <g fill="#2f3540">
        <path d="M336,206 C300,186 276,168 262,146 C288,158 312,176 334,192 Z"/>
        <path d="M338,214 C298,206 268,196 246,180 C278,188 310,196 338,202 Z"/>
        <path d="M340,222 C304,228 274,232 250,232 C282,238 312,236 342,230 Z"/>
      </g>
      <g fill="#f2f5f8" opacity=".85">
        <path d="M334,200 C306,184 288,170 276,154 C296,166 316,180 334,192 Z"/>
      </g>
      <animateTransform attributeName="transform" type="rotate"
                        values="0 340 212; -5 340 212; 0 340 212" dur="0.6s" repeatCount="indefinite"/>
    </g>

    <!-- 身体 -->
    <ellipse cx="382" cy="212" rx="62" ry="46" fill="#3a4049"/>
    <ellipse cx="392" cy="228" rx="46" ry="28" fill="#4d5561"/>
    <path d="M330,196 C356,176 412,176 438,204 C414,188 358,186 330,196 Z" fill="#5b6472" opacity=".8"/>

    <!-- 翅膀（扑动） -->
    <g>
      <path d="M344,196 C366,172 418,176 430,208 C410,230 360,232 344,212 Z" fill="#586271"/>
      <g stroke="#3a4049" stroke-width="2.5" fill="none" stroke-linecap="round">
        <path d="M362,214 C378,222 402,222 418,212"/>
        <path d="M356,204 C374,212 404,212 424,200"/>
      </g>
      <animateTransform attributeName="transform" type="rotate"
                        values="-6 392 202; 10 392 202; -6 392 202" dur="0.6s" repeatCount="indefinite"/>
    </g>

    <!-- 脖子 + 头（轻微摆动） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="0 412 196; -3 412 196; 0 412 196" dur="0.6s" repeatCount="indefinite"/>

      <path d="M410,196 C428,152 442,128 470,116" fill="none" stroke="#5b6472"
            stroke-width="19" stroke-linecap="round"/>
      <path d="M414,192 C430,154 444,134 468,122" fill="none" stroke="#727d8c"
            stroke-width="7" stroke-linecap="round" opacity=".7"/>

      <!-- 头 -->
      <g transform="rotate(-14 486 110)">
        <ellipse cx="486" cy="110" rx="23" ry="18" fill="#4a5361"/>
        <!-- 骑行小帽 -->
        <path d="M463,110 A23,18 0 0 1 509,110 Z" fill="#e04b3f"/>
        <path d="M463,110 A23,18 0 0 1 509,110" fill="none" stroke="#c23c31" stroke-width="2"/>
        <rect x="482" y="92" width="8" height="18" fill="#f4f7fa" opacity=".9"/>
        <ellipse cx="512" cy="112" rx="12" ry="5" fill="#c23c31"/>
        <!-- 喙 -->
        <path d="M505,103 L540,111 L505,121 Z" fill="#f2a65a"/>
        <path d="M505,112 L538,112" stroke="#d98c3e" stroke-width="1.6"/>
        <!-- 眼睛 -->
        <circle cx="492" cy="104" r="4.2" fill="#f7f9fb"/>
        <circle cx="493" cy="104" r="2.4" fill="#1d2229"/>
        <circle cx="494" cy="103" r="0.8" fill="#ffffff"/>
        <!-- 头冠羽 -->
        <g stroke="#3a4049" stroke-width="2.5" stroke-linecap="round" fill="none">
          <path d="M478,93 C474,84 470,80 466,78"/>
          <path d="M484,92 C482,83 480,78 478,74"/>
          <path d="M490,93 C491,84 492,80 494,76"/>
        </g>
      </g>
    </g>
  </g>

  <!-- 尘土 -->
  <g fill="#c9c2b4" opacity=".55">
    <circle cx="250" cy="398" r="6">
      <animate attributeName="cx" values="270;150" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="400;378" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;10" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".55;0" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="230" cy="402" r="5">
      <animate attributeName="cx" values="260;120" dur="0.9s" begin="0.45s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="404;384" dur="0.9s" begin="0.45s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;9" dur="0.9s" begin="0.45s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;0" dur="0.9s" begin="0.45s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
</div>

<div class="controls">
  <button id="pause" type="button">暂停</button>
  <button id="play" type="button">继续</button>
</div>
<footer>动画全部由 SVG SMIL 驱动，无外部依赖</footer>

<script>
  const scene = document.getElementById('scene');
  document.getElementById('pause').addEventListener('click', () => scene.pauseAnimations());
  document.getElementById('play').addEventListener('click', () => scene.unpauseAnimations());
</script>

</body>
</html>
