name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install MAUI workload
      run: dotnet workload install maui-windows

    - name: Restore dependencies
      run: dotnet restore src/GlassManagement.sln

    - name: Build solution
      run: dotnet build src/GlassManagement.sln --no-restore --configuration Release

    - name: Run tests
      run: dotnet test GlassManagement.Api.Tests/GlassManagement.Api.Tests.csproj --no-build --configuration Release --verbosity normal

    - name: Build Desktop.Blazor
      run: dotnet build GlassManagement.Desktop.Blazor/GlassManagement.Desktop.Blazor.csproj --no-restore --configuration Release
